name = "react-pricelist"
main = "src/worker.js"
compatibility_date = "2024-09-01"
workers_dev = true

# KV для кешу JSON-відповідей upstream (price-api). 7d TTL.
# id заповнюємо після `wrangler kv:namespace create CACHE`.
[[kv_namespaces]]
binding = "KV"
id = "43f3944ceae14436b969d5853022c881"

# Service binding на основний worker — щоб обійти CF loop guard (error 1042),
# який спрацьовує коли worker звертається до іншого worker по HTTP в межах
# одного акаунту. Service binding робить це in-process, без HTTP edge.
[[services]]
binding = "UPSTREAM"
service = "price-api"

# Service binding на react-bot — для відправки заявок дилера (react.ink/verify)
# у Telegram. Токен бота тут не тримаємо; сам бот шле через свій _notify_dealer.
[[services]]
binding = "BOT"
service = "react-bot"

# Cron — щогодини. refreshAll прогріває лише price_list (раз на день з 1С) та
# fx_nbu (раз на день зранку), тож 15-хв смикання upstream було марним. Щогодинний
# тригер покриває і ранкові години (06/07/08 UTC), коли банк публікує курс.
# Ручне оновлення прайсу — кнопка _refresh в адмінці (миттєво, не чекає cron).
[triggers]
crons = ["0 * * * *"]
